
<style>
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
  @keyframes flowDown { 0%{stroke-dashoffset:60} 100%{stroke-dashoffset:0} }
  @keyframes flowRight { 0%{stroke-dashoffset:60} 100%{stroke-dashoffset:0} }
  @keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
  @keyframes popIn { 0%{opacity:0;transform:scale(0.7)} 60%{transform:scale(1.1)} 100%{opacity:1;transform:scale(1)} }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-4px)} 40%{transform:translateX(4px)} 60%{transform:translateX(-3px)} 80%{transform:translateX(3px)} }
  @keyframes emailBounce { 0%{opacity:0;transform:translateY(-12px)} 60%{transform:translateY(3px)} 100%{opacity:1;transform:translateY(0)} }
  @keyframes dotTravel {
    0%   { offset-distance: 0%; opacity: 1; }
    90%  { opacity: 1; }
    100% { offset-distance: 100%; opacity: 0; }
  }
  .step-label { font: 500 12px "Anthropic Sans", sans-serif; fill: var(--color-text-secondary, #888); }
  .service-title { font: 500 13px "Anthropic Sans", sans-serif; }
  .service-sub { font: 400 11px "Anthropic Sans", sans-serif; }
  .arrow-label { font: 400 10px "Anthropic Sans", sans-serif; fill: var(--color-text-secondary, #888); }
  .active-glow rect { filter: drop-shadow(0 0 6px currentColor); }
  .flow-dot {
    width: 10px; height: 10px; border-radius: 50%;
    position: absolute; pointer-events: none;
    animation: dotTravel 1s linear forwards;
  }
</style>

<div style="padding: 16px 0 8px; position: relative;">
  <svg id="arch-svg" width="100%" viewBox="0 0 680 620" role="img">
    <title>AWS Security Monitoring System – Animated Architecture</title>
    <desc>Shows the flow from a user accessing a secret through CloudTrail, CloudWatch, SNS and email alert.</desc>
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
      <!-- Flow paths (used by JS to animate dots) -->
      <path id="p1" d="M340 118 L340 162" fill="none"/>
      <path id="p2" d="M340 218 L340 262" fill="none"/>
      <path id="p3" d="M340 318 L340 362" fill="none"/>
      <path id="p4" d="M340 418 L340 462" fill="none"/>
      <path id="p5" d="M520 490 L596 490 L596 530" fill="none"/>
      <path id="p6" d="M160 490 L84 490 L84 530" fill="none"/>
    </defs>

    <!-- ─── STEP LABELS ─── -->
    <text class="step-label" id="sl0" x="340" y="28" text-anchor="middle" opacity="0">Step 1 — Secret accessed</text>
    <text class="step-label" id="sl1" x="340" y="148" text-anchor="middle" opacity="0">Step 2 — CloudTrail records event</text>
    <text class="step-label" id="sl2" x="340" y="248" text-anchor="middle" opacity="0">Step 3 — Logs sent to CloudWatch</text>
    <text class="step-label" id="sl3" x="340" y="348" text-anchor="middle" opacity="0">Step 4 — Metric filter detects GetSecretValue</text>
    <text class="step-label" id="sl4" x="340" y="448" text-anchor="middle" opacity="0">Step 5 — Alarm triggers SNS</text>
    <text class="step-label" id="sl5" x="340" y="518" text-anchor="middle" opacity="0">Step 6 — Alert delivered</text>

    <!-- ─── CONNECTOR LINES ─── -->
    <!-- Secrets Manager → CloudTrail -->
    <line id="line1" x1="340" y1="118" x2="340" y2="162" stroke="var(--color-border-secondary,#ccc)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)" opacity="0.3"/>
    <!-- CloudTrail → CloudWatch -->
    <line id="line2" x1="340" y1="218" x2="340" y2="262" stroke="var(--color-border-secondary,#ccc)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)" opacity="0.3"/>
    <!-- CloudWatch → Alarm -->
    <line id="line3" x1="340" y1="318" x2="340" y2="362" stroke="var(--color-border-secondary,#ccc)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)" opacity="0.3"/>
    <!-- Alarm → SNS -->
    <line id="line4" x1="340" y1="418" x2="340" y2="462" stroke="var(--color-border-secondary,#ccc)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)" opacity="0.3"/>
    <!-- SNS → Email (right) -->
    <path id="line5" d="M520 490 L596 490 L596 545" stroke="var(--color-border-secondary,#ccc)" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)" opacity="0.3"/>
    <!-- SNS → S3 (left) -->
    <path id="line6" d="M160 490 L84 490 L84 545" stroke="var(--color-border-secondary,#ccc)" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)" opacity="0.3"/>

    <!-- Arrow labels -->
    <text class="arrow-label" x="355" y="145" opacity="0.6">GetSecretValue API</text>
    <text class="arrow-label" x="355" y="245" opacity="0.6">Log delivery</text>
    <text class="arrow-label" x="355" y="345" opacity="0.6">Metric filter match</text>
    <text class="arrow-label" x="355" y="445" opacity="0.6">IN ALARM state</text>

    <!-- ─── SERVICE BOXES ─── -->

    <!-- Secrets Manager -->
    <g id="box0" opacity="0.4">
      <rect x="200" y="40" width="280" height="76" rx="12" fill="var(--color-background-secondary,#f5f5f3)" stroke="var(--color-border-tertiary,#ddd)" stroke-width="0.5"/>
      <rect x="218" y="56" width="36" height="36" rx="8" fill="#C04D1E" opacity="0.15"/>
      <text x="236" y="79" text-anchor="middle" font-size="18">🔑</text>
      <text class="service-title" x="264" y="72" fill="var(--color-text-primary,#111)">AWS Secrets Manager</text>
      <text class="service-sub" x="264" y="89" fill="var(--color-text-secondary,#888)">TopSecretInfo — secret value retrieved</text>
    </g>

    <!-- CloudTrail -->
    <g id="box1" opacity="0.4">
      <rect x="200" y="162" width="280" height="76" rx="12" fill="var(--color-background-secondary,#f5f5f3)" stroke="var(--color-border-tertiary,#ddd)" stroke-width="0.5"/>
      <rect x="218" y="178" width="36" height="36" rx="8" fill="#146EB4" opacity="0.15"/>
      <text x="236" y="201" text-anchor="middle" font-size="18">🏞️</text>
      <text class="service-title" x="264" y="192" fill="var(--color-text-primary,#111)">AWS CloudTrail</text>
      <text class="service-sub" x="264" y="209" fill="var(--color-text-secondary,#888)">secrets-manager-trail — records event</text>
    </g>

    <!-- CloudWatch Logs -->
    <g id="box2" opacity="0.4">
      <rect x="200" y="262" width="280" height="76" rx="12" fill="var(--color-background-secondary,#f5f5f3)" stroke="var(--color-border-tertiary,#ddd)" stroke-width="0.5"/>
      <rect x="218" y="278" width="36" height="36" rx="8" fill="#E47911" opacity="0.15"/>
      <text x="236" y="301" text-anchor="middle" font-size="18">🔎</text>
      <text class="service-title" x="264" y="292" fill="var(--color-text-primary,#111)">Amazon CloudWatch Logs</text>
      <text class="service-sub" x="264" y="309" fill="var(--color-text-secondary,#888)">nextwork-secretsmanager-loggroup</text>
    </g>

    <!-- CloudWatch Alarm + Metric Filter -->
    <g id="box3" opacity="0.4">
      <rect x="200" y="362" width="280" height="76" rx="12" fill="var(--color-background-secondary,#f5f5f3)" stroke="var(--color-border-tertiary,#ddd)" stroke-width="0.5"/>
      <rect x="218" y="378" width="36" height="36" rx="8" fill="#C7131D" opacity="0.15"/>
      <text x="236" y="401" text-anchor="middle" font-size="18">🔔</text>
      <text class="service-title" x="264" y="392" fill="var(--color-text-primary,#111)">CloudWatch Alarm</text>
      <text class="service-sub" x="264" y="409" fill="var(--color-text-secondary,#888)">Metric filter: "GetSecretValue" ≥ 1</text>
    </g>

    <!-- SNS (center) -->
    <g id="box4" opacity="0.4">
      <rect x="160" y="462" width="360" height="60" rx="12" fill="var(--color-background-secondary,#f5f5f3)" stroke="var(--color-border-tertiary,#ddd)" stroke-width="0.5"/>
      <text x="236" y="497" text-anchor="middle" font-size="18">📣</text>
      <text class="service-title" x="266" y="490" fill="var(--color-text-primary,#111)">Amazon SNS</text>
      <text class="service-sub" x="266" y="507" fill="var(--color-text-secondary,#888)">SecurityAlarms topic — notify subscribers</text>
    </g>

    <!-- Email alert (right) -->
    <g id="box5" opacity="0.4">
      <rect x="526" y="545" width="130" height="56" rx="10" fill="var(--color-background-secondary,#f5f5f3)" stroke="var(--color-border-tertiary,#ddd)" stroke-width="0.5"/>
      <text x="554" y="577" text-anchor="middle" font-size="16">📧</text>
      <text class="service-title" x="572" y="570" fill="var(--color-text-primary,#111)">Email Alert</text>
      <text class="service-sub" x="572" y="587" fill="var(--color-text-secondary,#888)">ALARM: Secret accessed</text>
    </g>

    <!-- S3 (left) -->
    <g id="box6" opacity="0.4">
      <rect x="24" y="545" width="130" height="56" rx="10" fill="var(--color-background-secondary,#f5f5f3)" stroke="var(--color-border-tertiary,#ddd)" stroke-width="0.5"/>
      <text x="54" y="577" text-anchor="middle" font-size="16">🪣</text>
      <text class="service-title" x="72" y="570" fill="var(--color-text-primary,#111)">Amazon S3</text>
      <text class="service-sub" x="72" y="587" fill="var(--color-text-secondary,#888)">Log retention</text>
    </g>

    <!-- Active pulse overlay (hidden, shown on active step) -->
    <rect id="pulse-ring" x="198" y="38" width="284" height="80" rx="13" fill="none" stroke="#1D9E75" stroke-width="2" opacity="0"/>

  </svg>

  <!-- Controls -->
  <div style="display:flex; align-items:center; justify-content:center; gap:12px; margin-top:8px; flex-wrap:wrap;">
    <button id="btn-play" onclick="startAnim()" style="padding:6px 20px; font-size:13px; border-radius:8px; border:0.5px solid var(--color-border-secondary); background:var(--color-background-primary); cursor:pointer; color:var(--color-text-primary)">▶ Play</button>
    <button id="btn-reset" onclick="resetAnim()" style="padding:6px 16px; font-size:13px; border-radius:8px; border:0.5px solid var(--color-border-secondary); background:transparent; cursor:pointer; color:var(--color-text-secondary)">↺ Reset</button>
    <span id="step-info" style="font-size:12px; color:var(--color-text-secondary); min-width:200px; text-align:center"></span>
  </div>
</div>

<script>
const steps = [
  { box:'box0', line:null,  sl:'sl0', info:'User retrieves TopSecretInfo secret', color:'#C04D1E', pulsex:198, pulsey:38, pw:284, ph:80 },
  { box:'box1', line:'line1', sl:'sl1', info:'CloudTrail records GetSecretValue API call', color:'#146EB4', pulsex:198, pulsey:160, pw:284, ph:80 },
  { box:'box2', line:'line2', sl:'sl2', info:'Logs streamed to CloudWatch log group', color:'#E47911', pulsex:198, pulsey:260, pw:284, ph:80 },
  { box:'box3', line:'line3', sl:'sl3', info:'Metric filter detects "GetSecretValue" — counter +1', color:'#C7131D', pulsex:198, pulsey:360, pw:284, ph:80 },
  { box:'box4', line:'line4', sl:'sl4', info:'Alarm enters IN ALARM state → triggers SNS', color:'#7B1FA2', pulsex:158, pulsey:460, pw:364, ph:64 },
  { box:'box5', line:'line5', sl:'sl5', info:'Email alert delivered: ALARM: Secret accessed', color:'#1D9E75', pulsex:524, pulsey:543, pw:134, ph:60 },
  { box:'box6', line:'line6', sl:null, info:'CloudTrail logs stored in S3 for long-term audit', color:'#0F6E56', pulsex:22, pulsey:543, pw:134, ph:60 },
];

let timer = null;
let current = -1;
let playing = false;
const svg = document.getElementById('arch-svg');

function getSVGEl(id){ return document.getElementById(id); }

function highlightStep(i){
  steps.forEach((s,idx)=>{
    const b = getSVGEl(s.box);
    if(!b) return;
    b.style.opacity = idx <= i ? '1' : '0.35';
    b.style.transition = 'opacity 0.5s';
  });

  // Activate lines up to current
  ['line1','line2','line3','line4','line5','line6'].forEach((lid,idx)=>{
    const l = getSVGEl(lid);
    if(!l) return;
    l.style.opacity = idx < i ? '0.9' : '0.2';
    if(idx < i){
      l.setAttribute('stroke', steps[idx+1]?.color || '#888');
      l.style.transition = 'opacity 0.5s';
    }
  });

  // Step labels
  steps.forEach((s,idx)=>{
    if(!s.sl) return;
    const el = getSVGEl(s.sl);
    if(!el) return;
    el.style.opacity = idx === i ? '1' : '0';
    el.style.transition = 'opacity 0.4s';
  });

  // Pulse ring
  const pr = getSVGEl('pulse-ring');
  const s = steps[i];
  if(pr && s){
    pr.setAttribute('x', s.pulsex);
    pr.setAttribute('y', s.pulsey);
    pr.setAttribute('width', s.pw);
    pr.setAttribute('height', s.ph);
    pr.setAttribute('stroke', s.color);
    pr.style.opacity = '1';
    pr.style.animation = 'pulse 1s ease-in-out 3';
    setTimeout(()=>{ pr.style.opacity='0'; pr.style.animation='none'; }, 3100);
  }

  document.getElementById('step-info').textContent = s ? `Step ${i+1}/7 — ${s.info}` : '';
}

function startAnim(){
  if(playing) return;
  playing = true;
  document.getElementById('btn-play').style.opacity = '0.4';
  current = 0;
  highlightStep(current);
  timer = setInterval(()=>{
    current++;
    if(current >= steps.length){
      clearInterval(timer);
      playing = false;
      document.getElementById('btn-play').style.opacity = '1';
      document.getElementById('step-info').textContent = '✅ Complete — full alert pipeline demonstrated';
      return;
    }
    highlightStep(current);
  }, 1800);
}

function resetAnim(){
  clearInterval(timer);
  playing = false;
  current = -1;
  document.getElementById('btn-play').style.opacity = '1';
  document.getElementById('step-info').textContent = '';
  steps.forEach(s=>{
    const b = getSVGEl(s.box);
    if(b){ b.style.opacity='0.4'; b.style.transition='none'; }
    if(s.sl){ const el=getSVGEl(s.sl); if(el){ el.style.opacity='0'; } }
  });
  ['line1','line2','line3','line4','line5','line6'].forEach(lid=>{
    const l=getSVGEl(lid);
    if(l){ l.style.opacity='0.2'; l.setAttribute('stroke','var(--color-border-secondary,#ccc)'); }
  });
  const pr = getSVGEl('pulse-ring');
  if(pr){ pr.style.opacity='0'; }
}
</script>
